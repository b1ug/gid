name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CGO_ENABLED: "1"
  GOWORK: "off"

jobs:
  native:
    name: Native / ${{ matrix.os }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022]
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Record native toolchain
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED CC
          gcc --version
      - name: Build native backend
        run: go build -v ./...
      - name: Test without opening hardware
        run: go test -race -count=1 -timeout=2m -v ./...

  legacy-source:
    name: Legacy source / ubuntu-22.04 / Go 1.13.15
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.13.15"
          cache: false
      - name: Record legacy toolchain
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED CC
          gcc --version
      - name: Build and test Go 1.13 source compatibility
        run: |
          go build -v ./...
          go test -count=1 -timeout=2m -v ./...
